<!DOCTYPE html>
<html>
<head>
  <title>Logo Process</title>
</head>
<body>
  <h1>Processing Logo...</h1>
  <canvas id="canvas"></canvas>
  <script>
    const img = new Image();
    img.src = '/logo.jpg'; // black background logo
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;

      // Convert black background to transparent & find bounding box
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // If pixel is black/near black
        if (r < 25 && g < 25 && b < 25) {
          data[i + 3] = 0; // transparent
        } else {
          const x = (i / 4) % canvas.width;
          const y = Math.floor((i / 4) / canvas.width);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }

      ctx.putImageData(imageData, 0, 0);

      // Crop canvas to bounding box
      const cropWidth = maxX - minX + 1;
      const cropHeight = maxY - minY + 1;

      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = cropWidth;
      cropCanvas.height = cropHeight;
      const cropCtx = cropCanvas.getContext('2d');

      cropCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

      const dataUrl = cropCanvas.toDataURL('image/png');
      console.log('PROCESSED_DATA_URL:' + dataUrl);

      // Send to server endpoint or display on page
      document.body.innerHTML += `<img src="${dataUrl}" id="result" /><textarea id="base64">${dataUrl}</textarea>`;
    };
  </script>
</body>
</html>
